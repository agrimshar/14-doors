<!DOCTYPE html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0}body{background:var(--ink);color:var(--paper);font:400 14px/1.5 var(--font-mono);padding:var(--space-6)}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.row{display:flex;gap:var(--space-3);align-items:center;flex-wrap:wrap}
.btn{font:500 12px/1 var(--font-mono);letter-spacing:.16em;text-transform:uppercase;padding:16px 22px;border:1px solid var(--paper);color:var(--paper);border-radius:var(--radius-square);transition:background .25s,color .25s,box-shadow .25s}
.btn:hover:not(:disabled){background:var(--paper);color:var(--ink)}
.btn.solid{background:var(--paper);color:var(--ink)}.btn.solid:hover{box-shadow:var(--glow)}
.btn.dawn{background:var(--dawn);border-color:var(--dawn);color:var(--ink);box-shadow:var(--glow-dawn)}
.btn:disabled{opacity:.32;cursor:default}
.link{font:500 11px/1 var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);padding:10px 0;border-bottom:1px solid var(--faint)}
.link:hover{color:var(--paper);border-color:var(--paper)}
</style></head><body><div class="row">
<button class="btn">Step through · Md + Ps</button>
<button class="btn solid">Back to the night</button>
<button class="btn dawn">Let the morning in</button>
<button class="btn" disabled>Step through</button>
<button class="link">Leave early</button>
</div></body></html>
