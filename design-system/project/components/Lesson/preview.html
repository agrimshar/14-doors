<!DOCTYPE html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0}body{background:var(--ink);color:var(--paper);font:400 14px/1.5 var(--font-mono);padding:var(--space-6)}button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
.lessons{display:flex;flex-direction:column;gap:var(--space-2);max-width:640px}
.lesson{display:grid;grid-template-columns:auto 1fr;gap:var(--space-3);align-items:baseline;font:italic 400 24px/1.25 var(--font-display)}
.lesson i{width:10px;height:10px;transform:rotate(45deg) translateY(-2px);background:var(--c);box-shadow:0 0 18px 2px var(--c)}
.lesson small{display:block;font:500 10px/1.6 var(--font-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-style:normal}
</style></head><body><div class="lessons">
<div class="lesson" style="--c:var(--md-a)"><i></i><span><small>MDMA</small>The love was real. I could have said it sober.</span></div>
<div class="lesson" style="--c:var(--cf-a)"><i></i><span><small>Caffeine</small>Even the small ones are loans.</span></div>
<div class="lesson" style="--c:var(--dm-a)"><i></i><span><small>DMT</small>Some things only open when I stop gripping.</span></div>
</div></body></html>
