<!DOCTYPE html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..800;1,6..96,400..800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>*{box-sizing:border-box;margin:0}body{background:var(--ink);overflow:hidden}
.cover{position:relative;width:960px;height:288px;background:var(--ink)}
svg{position:absolute;inset:0}
.b1{fill:var(--md-a)}.b2{fill:var(--ps-b)}.b3{fill:var(--ad-a)}.b4{fill:var(--kt-a)}.b5{fill:var(--dawn)}.cut{fill:var(--ink)}
.name{position:absolute;left:var(--space-6);bottom:var(--space-6);max-width:440px}
.name h1{font:500 96px/.95 var(--font-display);letter-spacing:-.03em;color:var(--paper)}
.name p{margin-top:var(--space-3);font:400 13px/1.4 var(--font-mono);color:var(--dim)}
</style></head><body><div class="cover">
<!--
 blocks: md-a 104x196, ps-b 78x138, ad-a 130x248, kt-a 78x170, dawn 104x112; widths are 3, 4 and 5 steps of space-6
 arrangement: five arches of unequal height standing on the bottom edge with space-3 gaps, the last bleeding off the right edge
 pattern: a literal motif. The README says the arch is a door and the diamond is a light, so each arch carries a column of ink diamonds
 scales: space-6 pitch for widths and diamonds, space-3 gaps, radius-arch tops drawn as rx of half the width
-->
<svg viewBox="0 0 960 288" width="960" height="288" aria-hidden="true">
<rect class="b1" x="494" y="92" width="104" height="300" rx="52"/>
<rect class="b2" x="612" y="150" width="78" height="300" rx="39"/>
<rect class="b3" x="704" y="40" width="130" height="400" rx="65"/>
<rect class="b4" x="848" y="118" width="78" height="300" rx="39"/>
<rect class="b5" x="940" y="176" width="104" height="300" rx="52"/>
<g class="cut">
<rect x="541" y="113" width="10" height="10" transform="rotate(45 546 118)"/><rect x="541" y="139" width="10" height="10" transform="rotate(45 546 144)"/><rect x="541" y="165" width="10" height="10" transform="rotate(45 546 170)"/><rect x="541" y="191" width="10" height="10" transform="rotate(45 546 196)"/><rect x="541" y="217" width="10" height="10" transform="rotate(45 546 222)"/>
<rect x="646" y="171" width="10" height="10" transform="rotate(45 651 176)"/><rect x="646" y="197" width="10" height="10" transform="rotate(45 651 202)"/><rect x="646" y="223" width="10" height="10" transform="rotate(45 651 228)"/>
<rect x="764" y="61" width="10" height="10" transform="rotate(45 769 66)"/><rect x="764" y="87" width="10" height="10" transform="rotate(45 769 92)"/><rect x="764" y="113" width="10" height="10" transform="rotate(45 769 118)"/><rect x="764" y="139" width="10" height="10" transform="rotate(45 769 144)"/><rect x="764" y="165" width="10" height="10" transform="rotate(45 769 170)"/><rect x="764" y="191" width="10" height="10" transform="rotate(45 769 196)"/><rect x="764" y="217" width="10" height="10" transform="rotate(45 769 222)"/>
<rect x="882" y="139" width="10" height="10" transform="rotate(45 887 144)"/><rect x="882" y="165" width="10" height="10" transform="rotate(45 887 170)"/><rect x="882" y="191" width="10" height="10" transform="rotate(45 887 196)"/><rect x="882" y="217" width="10" height="10" transform="rotate(45 887 222)"/>
</g>
</svg>
<div class="name"><h1>Fourteen Doors</h1><p>Clinical labels on molten colour.</p></div>
</div></body></html>
